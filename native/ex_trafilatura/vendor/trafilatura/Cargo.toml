[package]
edition = "2021"
rust-version = "1.85"
name = "trafilatura"
version = "0.3.0+extrafilatura.1"
build = false
exclude = [
    "test-files/",
    "benches/",
    "scripts/",
    "CLAUDE.md",
    "PLAN.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extract readable content, comments, and metadata from web pages"
readme = "README.md"
keywords = [
    "trafilatura",
    "extraction",
    "html",
    "scraping",
    "content",
]
categories = [
    "parser-implementations",
    "text-processing",
    "web-programming",
]
license = "Apache-2.0"
repository = "https://github.com/nchapman/trafilatura-rs"

[features]
cli = [
    "dep:clap",
    "dep:reqwest",
    "dep:tracing-subscriber",
    "markdown",
]
markdown = ["dep:html2markdown"]

[lib]
name = "trafilatura"
path = "src/lib.rs"

[[bin]]
name = "trafilatura"
path = "src/bin/trafilatura.rs"
required-features = ["cli"]

[[test]]
name = "comparison_detail_test"
path = "tests/comparison_detail_test.rs"

[[test]]
name = "comparison_test"
path = "tests/comparison_test.rs"

[[test]]
name = "elements_test"
path = "tests/elements_test.rs"

[[test]]
name = "formatting_filter_test"
path = "tests/formatting_filter_test.rs"

[[test]]
name = "html_processing_test"
path = "tests/html_processing_test.rs"

[[test]]
name = "metadata_realworld_test"
path = "tests/metadata_realworld_test.rs"

[[test]]
name = "metadata_unit_test"
path = "tests/metadata_unit_test.rs"

[[test]]
name = "realworld_test"
path = "tests/realworld_test.rs"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.ego-tree]
version = "0.11"

[dependencies.html2markdown]
version = "0.2"
optional = true

[dependencies.html5ever]
version = "0.39"

[dependencies.justext]
version = "0.2"

[dependencies.libreadability]
version = "0.2"

[dependencies.regex]
version = "1"

[dependencies.reqwest]
version = "0.12"
features = ["blocking"]
optional = true

[dependencies.scraper]
version = "0.26"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tendril]
version = "0.5"

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
optional = true

[dependencies.unicode-normalization]
version = "0.1"

[dependencies.url]
version = "2"

[dependencies.whatlang]
version = "0.18"

[dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[dev-dependencies.encoding_rs]
version = "0.8"

[dev-dependencies.pretty_assertions]
version = "1"
